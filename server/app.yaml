runtime: nodejs22

# This service name can be 'default' or a custom name
service: default

# Runtime identity. The app authenticates to Firestore as this service account
# (issue #418) - no downloaded JSON key is deployed. Required explicitly because
# the org enforces constraints/appengine.enforceServiceAccountActAsCheck.
service_account: appengine-default@curriculum-portal-1ce8f.iam.gserviceaccount.com

# The instance class defines the compute resources allocated to the service
instance_class: F2

# Automatic scaling configuration
automatic_scaling:
  max_instances: 10
  min_instances: 1

# Environment variables
env_variables:
  NODE_ENV: 'production'
  # Where production data actually lives. Kept here, in version control,
  # rather than only in the untracked .env.production that disagreed with the
  # frontend and silently pointed the API at an empty namespace (#427).
  DATABASE_SCHEMA_QUALIFIER: 'prod.'

# The entry point for your app
entrypoint: npm start
