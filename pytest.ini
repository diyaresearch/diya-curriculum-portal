[pytest]
# Pytest configuration for DIYA Curriculum Portal API tests
#
# This used to be [tool:pytest], which pytest only honors inside setup.cfg;
# in a file actually named pytest.ini the section must be [pytest]. That
# typo silently disabled every setting below - testpaths, addopts (so
# --strict-markers never ran), the markers list, and timeout - for as long
# as this file has existed (#436).

# Test discovery
testpaths = tests
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    auth: Authentication and authorization tests
    admin: Admin-only endpoint tests
    user: User management tests
    error: Error handling tests
    integration: Integration tests requiring server

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Note: Coverage settings are handled via command line options when running tests