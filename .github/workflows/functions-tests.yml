name: Functions Tests

# Regression coverage for the Cloud Functions payment endpoints
# (issue #432: an undefined `stripe` reference 500'd three routes).

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-tests.yml"
  push:
    branches:
      - main
    paths:
      - "functions/**"

jobs:
  functions-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: functions
        run: npm test
