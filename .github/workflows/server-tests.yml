name: Server Tests

# Regression coverage for the Express API's security-sensitive routes
# (issue #425: registration must never mint a privileged role).

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  server-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: server
        run: npm test
