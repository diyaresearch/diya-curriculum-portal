name: Firestore Rules Tests

# Security rules are the only thing standing between the client SDK and the
# database — the frontend reads Firestore directly. Run the rules test suite on
# every change to the rules or the tests (issues #419, #420, #382).

on:
  pull_request:
    paths:
      - "portal-app/firestore.rules"
      - "tests/rules/**"
      - ".github/workflows/firestore-rules-tests.yml"
  push:
    branches:
      - main
    paths:
      - "portal-app/firestore.rules"
      - "tests/rules/**"

jobs:
  rules-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      - name: Run rules tests
        working-directory: tests/rules
        run: npm test
