name: CI

# Comprehensive PR validation (issue #435): a PR that does not compile or
# does not pass lint/tests must not merge green. Runs unconditionally on
# every PR (no path filters) so the required jobs below always report a
# status — a path-filtered workflow can leave a required check stuck on
# "Expected" forever for PRs that don't touch that path.
#
# `portal-app` now also runs `npm run typecheck` between lint and build, for
# the TypeScript migration (#365). It is a step of the existing required
# `portal-app` job rather than a new job, so it needs no branch-protection
# change to start gating.
#
# `portal-app` and `functions` are REQUIRED checks in main's branch
# protection. There used to be a third, `server`, for the App Engine backend;
# #439 collapsed that into `functions` (one backend, one deploy target), so a
# repo admin needs to drop `server` from the required-checks list or PRs will
# block on a check that can never report again.
#
# `api-integration` no longer sets continue-on-error (#436 fixed the 3
# tests that were failing against current auth behavior, deleted the
# mock-only tests.signup.py suite that ran alongside it, and fixed a mock
# Firebase Admin bug that broke auth for every mock-mode caller).
#
# `dependency-audit` (#437) blocks on all three matrix legs — all are
# clean at --audit-level=high. portal-app's leg was non-blocking until #503
# swapped react-scripts/CRA for Vite: that migration took it from 40
# advisories (1 critical, 10 high) to 2 low.
#
# `firestore-rules` calls the reusable firestore-rules-tests.yml workflow,
# which boots a real Firestore emulator against `portal-app/firestore.rules`.
# It restores the coverage #501 removed with the standalone workflow — #428's
# last acceptance criterion makes the rules deploy automatic, and an
# automatic deploy needs an automatic test in front of it. The same called
# workflow gates deploy-firestore-config.yml, so the tested rules and the
# deployed rules are checked by identical steps.
#
# Both api-integration and dependency-audit still need a repo admin to
# actually add them to branch protection's required-checks list — this
# workflow file can't do that part.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  portal-app:
    name: portal-app
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: portal-app
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: portal-app
        run: npm run lint

      # tsc --noEmit (#365). The build does NOT cover this: Vite transpiles
      # with esbuild, which strips types without checking them, so a type
      # error compiles and ships. This is the only step that fails on one.
      - name: Typecheck
        working-directory: portal-app
        run: npm run typecheck

      - name: Build
        working-directory: portal-app
        run: npm run build
        env:
          CI: true

      # `npm test` is `vitest run` — single-shot by construction, so it
      # needs no CRA-era --watchAll=false.
      - name: Test
        working-directory: portal-app
        run: npm test
        env:
          CI: true

  functions:
    name: functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: functions
        run: npm test

      # `npm test` never boots the app - it only ever unit-tests modules in
      # isolation. app.js registers `app.options("*", cors())` in the
      # `if (env === 'production')` branch specifically, and Express 5's
      # router throws synchronously at *registration* time on a bare "*"
      # wildcard, before the app serves anything - a hard crash on every
      # production boot that neither this job's unit tests nor api-integration
      # (which only ever boots with NODE_ENV=test) could have caught.
      # Confirmed missed in exactly this way: the bug shipped and sat
      # undetected until a manual production-mode boot surfaced it locally
      # (#393's PR).
      #
      # local.js is the plain-Node entry point around the same app.js the
      # deployed function wraps, so booting it exercises the real middleware
      # and route registration.
      - name: Boot in production mode (catches route-registration crashes npm test can't)
        working-directory: functions
        env:
          NODE_ENV: production
          ENABLE_MOCK_FIREBASE: "true"
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          PORT: "3001"
          SERVER_ALLOW_ORIGIN: "https://learn.diyaresearch.org"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          FIREBASE_PROJECT_ID: "test-project-id"
        run: |
          nohup node local.js > api-prod-boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/ > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in production mode" >&2
          cat api-prod-boot.log
          exit 1

      - name: Production boot log (always, for debugging)
        if: always()
        run: cat functions/api-prod-boot.log || true

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [portal-app, functions]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci --no-audit --no-fund

      - name: Audit (high and critical)
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install API dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Install pytest dependencies
        run: pip install -r tests/requirements.txt

      - name: Boot API (mock Firebase, no real credentials required)
        working-directory: functions
        env:
          NODE_ENV: test
          ENABLE_MOCK_FIREBASE: "true"
          # Nothing loads config/firebaseConfig at require time any more
          # (#366 moved the last controllers onto databaseService), so this is
          # no longer needed to boot. It is kept so that the paths which do
          # resolve a credential lazily — local.js's boot check, /api/health —
          # point at an unstarted emulator rather than at real Firestore.
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          PORT: "3001"
          SERVER_ALLOW_ORIGIN: "http://localhost:3000"
        run: |
          nohup node local.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/ > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          cat api.log
          exit 1

      - name: Run integration tests
        env:
          API_BASE_URL: http://localhost:3001/api
        run: pytest -v

      - name: API log (always, for debugging)
        if: always()
        run: cat functions/api.log || true

  # Firestore security rules are the frontend's only protection — it talks to
  # Firestore directly with the client SDK. The suite boots a real Firestore
  # emulator, so it lives in a called workflow shared with
  # deploy-firestore-config.yml (see firestore-rules-tests.yml for why).
  #
  # Unconditional, like every other job here: `portal-app/firestore.rules` is
  # not the only input to a rules regression — a query or a collection rename
  # elsewhere in the PR can invalidate a rule without touching the rules file.
  firestore-rules:
    name: firestore-rules
    uses: ./.github/workflows/firestore-rules-tests.yml
