version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/portal-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Only minor/patch bumps get grouped into one PR - these are the ones
      # safe to take on trust and merge routinely. Majors are deliberately
      # left out of every group below, so each gets its own PR instead of
      # being silently bundled into whatever patch bump happens to land the
      # same week. #510 bundled a React 18->19 major with 9 other updates,
      # including 3 more majors (firebase, @stripe/react-stripe-js,
      # @stripe/stripe-js) - react-quill@2.0.0 (unmaintained, peer-capped at
      # React 18) blocked npm install outright, which meant the whole PR was
      # unmergeable even though most of what it carried was fine on its own.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v14 removed the root-namespace API (admin.apps/.app()/.firestore()/
      # .storage()) this codebase depends on throughout — confirmed breaks
      # server boot (#465, re-confirmed #481). Needs a real migration to
      # the modular API before revisiting, not a routine bump.
      - dependency-name: "firebase-admin"
        versions: [">=14.0.0"]
      # >=2.17.2 bumps its htmlparser2 dependency past v8, to an ESM-only
      # release (v9+) — confirmed breaks `npm test` outright: Jest's default
      # CommonJS transform can't require() it (#381). Revisit once either
      # this project's Jest setup transforms ESM node_modules, or Node here
      # is >=24.9 (native require(esm) support).
      - dependency-name: "sanitize-html"
        versions: [">=2.17.2"]

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v14 conflicts with firebase-functions-test@3.5.0's peer range
      # (^8..^13), which broke `npm ci` after #460 bumped this to 14.3.0.
      # Revisit once firebase-functions-test supports v14, or drop it.
      - dependency-name: "firebase-admin"
        versions: [">=14.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
