<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="DIYA curriculum portal" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when this app is installed on a
      user's mobile device or desktop.
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>DIYA curriculum portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Vite treats this file as the build entry point, so it lives at the
      project root (not public/) and loads the app directly. Everything still
      in public/ is copied to the build output root verbatim, which is why the
      hrefs above are plain absolute paths rather than CRA's %PUBLIC_URL%.
    -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
